<template>
    <lightning-card variant="Narrow" title="Lead Details" icon-name="standard:lead">
        <div class="slds-p-around_medium">
            <template if:true={leadData}>
                <p><strong>Name:</strong> {name}</p>
                <p><strong>Email:</strong> {email}</p>
                <p><strong>Title:</strong> {title}</p>
                <p><strong>Phone:</strong> {phone}</p>
                <p><strong>Company:</strong> {company}</p>
                <p><strong>Industry:</strong> {industry}</p>
                <p><strong>Annual Revenue:</strong> {annualRevenue}</p>
                <p><strong>Lead Source:</strong> {leadSource}</p>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error">Error loading lead: {error.body.message}</p>
            </template>
        </div>
    </lightning-card>
</template>
