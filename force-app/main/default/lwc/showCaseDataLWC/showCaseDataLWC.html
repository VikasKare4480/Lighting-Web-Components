<template>
    <lightning-card  variant="Brand" title="Close Case" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <!-- <lightning-record-form
                object-api-name={objectApiName}
                record-id={recordId}
                fields={fields}
                mode="edit">
            </lightning-record-form> -->
            <lightning-record-edit-form id="recordEditForm"
                        record-id={recordId}
                        object-api-name={objectApiName}
                        onsuccess={onSuccess}
                        onerror={onError}
                        onsubmit={onSubmit}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="CaseNumber" disabled></lightning-input-field>
                <lightning-input-field field-name="Priority"></lightning-input-field>
                <lightning-input-field field-name="AccountId"></lightning-input-field>
                <lightning-input-field field-name="ContactId"></lightning-input-field>
                <lightning-input-field field-name="Description"></lightning-input-field>
                <!--Picklist-->
                <lightning-input-field field-name="Status"></lightning-input-field>
                 <lightning-input-field field-name="EngineeringReqNumber__c"></lightning-input-field>
                <!-- submit -->
                <lightning-button type="submit" label="Update record"></lightning-button>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
    
</template>
